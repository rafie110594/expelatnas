<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a56db" />
  <title>Dashboard Anggota - PB EX PELATNAS</title>
  <link rel="icon" href="assets/logo-round.png" type="image/png" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" crossorigin rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    html, body { background: #f5f8ff; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .member-tab {
      flex: 1 0 auto; min-width: 76px; padding: 8px 14px; border-radius: 10px;
      text-align: center; font-size: 12px; font-weight: 700; color: #64748b;
      transition: background-color .15s, color .15s, box-shadow .15s;
    }
    .member-tab:hover { background: #f8fafc; color: #0f172a; }
    .member-tab.is-active { background: #1d4ed8; color: #fff; box-shadow: 0 4px 12px rgba(29,78,216,.2); }
  </style>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/ui.js"></script>
</head>
<body class="pb-bg min-h-screen flex flex-col antialiased">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-blue-100">
    <div class="h-1 w-full pb-accent-line"></div>
    <div class="max-w-6xl mx-auto h-16 px-4 flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-2.5 min-w-0">
        <img src="assets/logo-round.png" alt="Logo PB Ex Pelatnas" class="h-10 w-10 rounded-full shadow-lg shadow-blue-600/20" />
        <span class="leading-tight min-w-0">
          <span class="block font-display text-[15px] font-bold tracking-tight text-slate-900 truncate">PB EX PELATNAS</span>
          <span class="block text-[10px] font-extrabold uppercase tracking-[0.18em] text-blue-600">Dashboard Anggota</span>
        </span>
      </a>
      <nav class="hidden md:flex items-center gap-1 text-[12px] font-bold">
        <a href="member.html" class="px-3.5 py-2 rounded-full bg-orange-50 text-orange-700">Dashboard</a>
        <a href="leaderboard.html" class="px-3.5 py-2 rounded-full text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-colors">Ranking</a>
        <a href="events.html" class="px-3.5 py-2 rounded-full text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-colors">Event</a>
      </nav>
      <div class="flex items-center gap-2">
        <a href="leaderboard.html" class="md:hidden h-9 w-9 rounded-full bg-slate-100 grid place-items-center text-slate-600"><span class="material-symbols-outlined text-[19px]">leaderboard</span></a>
        <button type="button" id="btnLogout" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-full text-[12px] font-bold text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition-colors">
          <span class="material-symbols-outlined text-[18px]">logout</span><span class="hidden sm:inline">Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 md:py-8">
    <nav id="memberTabs" class="hidden sticky top-16 z-30 -mx-4 mb-4 px-4 py-2 bg-[#f5f8ff]/95 backdrop-blur border-b border-blue-100/60" aria-label="Navigasi dashboard anggota">
      <div class="max-w-3xl mx-auto flex gap-1 p-1 rounded-2xl border border-blue-100 bg-white shadow-sm overflow-x-auto no-scrollbar">
        <a href="#overview" data-member-nav="overview" class="member-tab">Ringkasan</a>
        <a href="#stats" data-member-nav="stats" class="member-tab">Statistik</a>
        <a href="#points" data-member-nav="points" class="member-tab">Poin</a>
        <a href="#profile" data-member-nav="profile" class="member-tab">Profil</a>
      </div>
    </nav>
    <div id="memberContent">
      <div class="h-64 rounded-3xl bg-white border border-blue-100 animate-pulse"></div>
    </div>
  </main>

  <footer class="border-t border-blue-100 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p class="text-[11px] text-slate-400">PB EX PELATNAS &middot; Sistem ranking klub</p>
      <a href="index.html" class="text-[11px] font-bold text-blue-600 hover:text-blue-800">Kembali ke beranda</a>
    </div>
  </footer>

  <div id="editModal" class="fixed inset-0 z-[70] hidden bg-slate-900/40 backdrop-blur-sm items-center justify-center p-4">
    <div class="w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-2xl border border-blue-100 bg-white shadow-2xl">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 sticky top-0 bg-white rounded-t-2xl">
        <div><h2 class="font-display text-lg font-bold">Edit Profil</h2><p class="text-[11px] text-slate-400">Perbarui data akun dan foto profil.</p></div>
        <button type="button" id="closeEdit" class="h-8 w-8 rounded-lg hover:bg-slate-100 grid place-items-center"><span class="material-symbols-outlined text-[20px]">close</span></button>
      </div>
      <form id="editForm" class="p-5 space-y-3.5">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nama lengkap</label>
          <input name="fullName" type="text" maxlength="120" required class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-[13px] outline-none focus:border-blue-400 focus:bg-white" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Gender</label>
            <select name="gender" class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-[13px] outline-none focus:border-blue-400 focus:bg-white">
              <option value="">Pilih</option>
              <option value="LAKI_LAKI">Laki-laki</option>
              <option value="PEREMPUAN">Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Tanggal lahir</label>
            <input name="birthDate" type="date" class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-[13px] outline-none focus:border-blue-400 focus:bg-white" />
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nomor telepon</label>
          <input name="phone" type="tel" maxlength="20" class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-[13px] outline-none focus:border-blue-400 focus:bg-white" />
        </div>
        <div class="rounded-xl border border-blue-100 bg-blue-50/60 p-3">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-blue-700 mb-1.5">Foto profil</label>
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="block w-full text-[11px] text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-bold file:text-[11px]" />
          <p class="mt-1 text-[10px] text-blue-600">Maksimal 3 MB. JPG, PNG, WEBP, atau GIF.</p>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" id="cancelEdit" class="px-4 py-2.5 rounded-xl text-[11px] font-bold text-slate-500 hover:bg-slate-100">Batal</button>
          <button type="submit" id="saveProfile" class="px-5 py-2.5 rounded-xl pb-btn text-[11px] font-bold disabled:opacity-60">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var esc = PBUI.escapeHtml;
      var current = null;
      var stats = null;

      var RANK_STYLE = {
        A: 'from-[#050f38] via-[#021c97] to-[#fc6703]',
        'B+': 'from-[#0a1f6e] via-[#1231b8] to-[#fc6703]',
        B: 'from-[#021c97] to-[#1f43c9]',
        C: 'from-[#1f43c9] to-[#ff9a4d]',
        D: 'from-slate-600 to-slate-400'
      };

      function initials(name) {
        var parts = String(name || '?').trim().split(/\s+/);
        return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
      }
      function displayName(p) { return (p && p.alias) ? p.alias : (p && p.fullName) || '-'; }
      function genderLabel(g) { return g === 'LAKI_LAKI' ? 'Laki-laki' : g === 'PEREMPUAN' ? 'Perempuan' : '-'; }
      function defaultAvatar(g) {
        if (g === 'LAKI_LAKI') return 'assets/avatar-cowok.svg';
        if (g === 'PEREMPUAN') return 'assets/avatar-cewek.svg';
        return '';
      }
      function dateInput(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return '';
        return d.toISOString().slice(0, 10);
      }

      var MEMBER_PANELS = ['overview', 'stats', 'points', 'profile'];
      var POINT_LABELS = {
        INITIAL: 'Poin awal',
        MATCH_WIN: 'Menang laga',
        MATCH_LOSS: 'Kalah laga',
        ADJUSTMENT: 'Penyesuaian admin',
        REVERSAL: 'Koreksi hasil'
      };

      function activeMemberPanel() {
        var name = (window.location.hash || '').replace(/^#/, '');
        return MEMBER_PANELS.indexOf(name) >= 0 ? name : 'overview';
      }

      function showMemberPanel(name) {
        if (MEMBER_PANELS.indexOf(name) < 0) name = 'overview';
        document.querySelectorAll('[data-member-panel]').forEach(function (panel) {
          panel.classList.toggle('hidden', panel.getAttribute('data-member-panel') !== name);
        });
        document.querySelectorAll('[data-member-nav]').forEach(function (link) {
          var on = link.getAttribute('data-member-nav') === name;
          link.classList.toggle('is-active', on);
          if (on) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
        if (window.location.hash !== '#' + name) {
          history.replaceState(null, '', '#' + name);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.addEventListener('hashchange', function () {
        if (current) showMemberPanel(activeMemberPanel());
      });

      function formBadges(form) {
        var html = (form || []).map(function (f) {
          return '<span class="h-7 min-w-7 px-1.5 rounded-lg grid place-items-center text-[10px] font-extrabold ' +
            (f === 'W' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600') + '">' + esc(f) + '</span>';
        }).join('');
        return html || '<span class="text-[11px] text-slate-400">Belum ada</span>';
      }

      function detailCard(label, value) {
        return '<div class="rounded-xl border border-slate-100 bg-slate-50/80 p-3">' +
          '<p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">' + esc(label) + '</p>' +
          '<p class="font-display text-lg font-bold text-slate-900 mt-1">' + esc(value) + '</p></div>';
      }

      function pointRow(tx) {
        var delta = Number(tx.delta) || 0;
        var sign = delta > 0 ? '+' : '';
        var tone = delta > 0 ? 'text-emerald-700 bg-emerald-50 border-emerald-100'
          : delta < 0 ? 'text-rose-600 bg-rose-50 border-rose-100'
            : 'text-slate-600 bg-slate-50 border-slate-100';
        var label = POINT_LABELS[tx.type] || tx.type || 'Transaksi';
        return '<div class="flex items-center justify-between gap-3 rounded-xl border border-slate-100 bg-white p-3">' +
          '<div class="min-w-0"><p class="text-[12px] font-bold text-slate-800 truncate">' + esc(label) + '</p>' +
          '<p class="text-[10px] text-slate-400 mt-0.5">' + esc(tx.createdAt ? PBUI.fmtDate(tx.createdAt) : '-') + '</p></div>' +
          '<div class="flex items-center gap-2 shrink-0">' +
          '<span class="px-2 py-1 rounded-lg border text-[11px] font-extrabold ' + tone + '">' + sign + PBUI.fmtNum(delta) + ' Pts</span>' +
          '<span class="text-[10px] font-semibold text-slate-400">' + PBUI.fmtNum(tx.pointsAfter) + '</span>' +
          '</div></div>';
      }

      function render(user) {
        current = user;
        var p = user.profile || {};
        var rank = p.rank;
        var rankName = rank ? rank.name : '-';
        var gradient = RANK_STYLE[rankName] || 'from-slate-700 to-slate-500';
        var photoSrc = p.photoUrl || defaultAvatar(user.gender);
        var photo = photoSrc
          ? '<img src="' + esc(photoSrc) + '" alt="" class="h-24 w-24 rounded-2xl object-cover border-4 border-white shadow-lg" />'
          : '<span class="h-24 w-24 rounded-2xl grid place-items-center bg-white/15 border-2 border-white/30 text-white font-display text-3xl font-bold">' + esc(initials(user.fullName)) + '</span>';

        var s = stats || {};
        var streak = s.currentStreak ? (s.currentStreak.type === 'win' ? s.currentStreak.count + ' menang beruntun' : s.currentStreak.count + ' kalah beruntun') : 'Belum ada';
        var form = formBadges(s.recentForm);
        var pointsThisMonth = Number(s.pointsThisMonth) || 0;

        var trend = (s.trend || []).map(function (t) { return Number(t.pointsAfter) || 0; });
        var max = trend.length ? Math.max.apply(null, trend) : 0;
        var min = trend.length ? Math.min.apply(null, trend) : 0;
        var span = Math.max(1, max - min);
        var bars = trend.map(function (v) {
          var h = 18 + Math.round(((v - min) / span) * 52);
          return '<div class="flex-1 min-w-[6px] rounded-t-md bg-white/70" style="height:' + h + 'px" title="' + v + ' pts"></div>';
        }).join('');

        var txRows = (s.trend || []).slice().reverse().map(pointRow).join('');
        var container = document.getElementById('memberContent');
        container.innerHTML =
          '<div data-member-panel="overview" class="space-y-4">' +
          '<section class="relative overflow-hidden rounded-3xl bg-gradient-to-br ' + gradient + ' p-5 md:p-7 text-white shadow-2xl shadow-blue-900/20">' +
          '<div class="absolute -right-10 -top-10 h-48 w-48 rounded-full bg-white/10 blur-2xl"></div>' +
          '<div class="relative flex flex-col sm:flex-row sm:items-center gap-5">' + photo +
          '<div class="min-w-0 flex-1">' +
          '<p class="text-[10px] font-extrabold uppercase tracking-[0.18em] text-blue-100">Anggota klub</p>' +
          '<h1 class="font-display text-2xl md:text-3xl font-bold tracking-tight mt-1 truncate">' + esc(displayName(user)) + '</h1>' +
          (user.alias && user.fullName ? '<p class="text-[12px] text-blue-100 mt-0.5">' + esc(user.fullName) + '</p>' : '') +
          '<div class="mt-2 flex flex-wrap items-center gap-2 text-[11px] font-semibold">' +
          '<span class="px-2.5 py-1 rounded-lg bg-white/15 border border-white/20">' + esc(p.memberNumber || '-') + '</span>' +
          '<span class="px-2.5 py-1 rounded-lg bg-white/15 border border-white/20">' + esc(genderLabel(user.gender)) + '</span>' +
          '<span class="px-2.5 py-1 rounded-lg bg-white/15 border border-white/20">Rank ' + esc(rankName) + '</span>' +
          '</div></div>' +
          '<div class="sm:text-right shrink-0"><p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-100">Total poin</p>' +
          '<p class="font-display text-4xl md:text-5xl font-bold leading-none mt-1">' + PBUI.fmtNum(p.currentPoints) + '</p>' +
          '<a href="#stats" class="mt-3 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white text-blue-700 text-[11px] font-bold hover:bg-blue-50 transition-colors"><span class="material-symbols-outlined text-[16px]">monitoring</span>Lihat statistik</a></div>' +
          '</div></section>' +

          '<section class="grid grid-cols-2 lg:grid-cols-4 gap-3">' +
          card('Pertandingan', PBUI.fmtNum(s.totalMatches), 'sports_tennis', 'text-blue-700 bg-blue-50') +
          card('Menang', PBUI.fmtNum(s.wins), 'emoji_events', 'text-emerald-700 bg-emerald-50') +
          card('Kalah', PBUI.fmtNum(s.losses), 'sports', 'text-rose-600 bg-rose-50') +
          card('Win rate', (s.winRate != null ? s.winRate : 0) + '%', 'percent', 'text-indigo-700 bg-indigo-50') +
          '</section>' +

          '<section class="grid sm:grid-cols-2 gap-3">' +
          '<div class="rounded-2xl border border-blue-100 bg-white p-4"><p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Rank saat ini</p><p class="font-display text-2xl font-bold mt-1">Rank ' + esc(rankName) + '</p><p class="text-[11px] text-slate-500 mt-1">' + PBUI.fmtNum(p.currentPoints) + ' poin total</p></div>' +
          '<div class="rounded-2xl border border-blue-100 bg-white p-4"><p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Bulan ini</p><p class="font-display text-2xl font-bold mt-1 ' + (pointsThisMonth >= 0 ? 'text-emerald-600' : 'text-rose-600') + '">' + (pointsThisMonth >= 0 ? '+' : '') + PBUI.fmtNum(pointsThisMonth) + ' poin</p><p class="text-[11px] text-slate-500 mt-1">Perubahan poin bulan berjalan</p></div>' +
          '</section>' +

          '<section class="rounded-2xl border border-blue-100 bg-white p-4 flex flex-col sm:flex-row items-center justify-between gap-3">' +
          '<div><p class="text-[12px] font-bold">Mau lihat posisi klub secara lengkap?</p><p class="text-[11px] text-slate-500 mt-0.5">Bandingkan poin dan statistikmu dengan anggota lain.</p></div>' +
          '<a href="leaderboard.html" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl pb-btn text-[11px] font-bold"><span class="material-symbols-outlined text-[17px]">leaderboard</span>Buka ranking</a>' +
          '</section>' +
          '</div>' +

          '<div data-member-panel="stats" class="hidden space-y-4">' +
          '<section class="rounded-2xl border border-blue-100 bg-white p-4 md:p-5">' +
          '<div class="flex items-center justify-between gap-3"><div><p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-600">Performa</p><h2 class="font-display text-lg font-bold mt-0.5">Tren poin terakhir</h2></div>' +
          '<span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-[10px] font-bold">' + (pointsThisMonth >= 0 ? '+' : '') + PBUI.fmtNum(pointsThisMonth) + ' bulan ini</span></div>' +
          '<div class="mt-5 flex items-end gap-1.5 h-28 rounded-xl bg-gradient-to-b from-blue-700 via-blue-500 to-orange-500 p-3">' + (bars || '<p class="m-auto text-[11px] text-blue-100">Belum ada riwayat poin</p>') + '</div>' +
          '<div class="mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Streak</p><p class="text-[12px] font-bold mt-0.5">' + esc(streak) + '</p></div>' +
          '<div class="sm:text-right"><p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">10 laga terakhir</p><div class="mt-1 flex gap-1 sm:justify-end">' + form + '</div></div></div>' +
          '</section>' +

          '<section class="rounded-2xl border border-blue-100 bg-white p-4 md:p-5">' +
          '<p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-600">Rincian</p><h2 class="font-display text-lg font-bold mt-0.5">Statistik pertandingan</h2>' +
          '<div class="mt-4 grid grid-cols-2 lg:grid-cols-4 gap-2.5">' +
          detailCard('Total laga', PBUI.fmtNum(s.totalMatches)) +
          detailCard('Menang', PBUI.fmtNum(s.wins)) +
          detailCard('Kalah', PBUI.fmtNum(s.losses)) +
          detailCard('Win rate', (s.winRate != null ? s.winRate : 0) + '%') +
          detailCard('Poin menang', '+' + PBUI.fmtNum(s.pointsFromWins || 0)) +
          detailCard('Poin kalah', PBUI.fmtNum(s.pointsFromLosses || 0)) +
          detailCard('Poin bulan ini', (pointsThisMonth >= 0 ? '+' : '') + PBUI.fmtNum(pointsThisMonth)) +
          detailCard('Rank', rankName) +
          '</div></section>' +
          '</div>' +

          '<div data-member-panel="points" class="hidden space-y-4">' +
          '<section class="relative overflow-hidden rounded-3xl bg-gradient-to-br ' + gradient + ' p-5 md:p-6 text-white shadow-xl shadow-blue-900/15">' +
          '<div class="absolute -right-8 -bottom-8 h-40 w-40 rounded-full bg-white/10 blur-2xl"></div>' +
          '<div class="relative flex flex-col sm:flex-row sm:items-end justify-between gap-4">' +
          '<div><p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-100">Saldo poin</p><p class="font-display text-4xl md:text-5xl font-bold leading-none mt-1">' + PBUI.fmtNum(p.currentPoints) + '</p><p class="text-[11px] text-blue-100 mt-2">Rank ' + esc(rankName) + ' &middot; ' + (pointsThisMonth >= 0 ? '+' : '') + PBUI.fmtNum(pointsThisMonth) + ' poin bulan ini</p></div>' +
          '<a href="#stats" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white/15 border border-white/25 text-white text-[11px] font-bold hover:bg-white/25 transition-colors"><span class="material-symbols-outlined text-[16px]">monitoring</span>Lihat tren</a>' +
          '</div></section>' +
          '<section class="rounded-2xl border border-blue-100 bg-white p-4 md:p-5">' +
          '<div class="flex items-center justify-between pb-3 border-b border-slate-100"><div><p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-600">Riwayat</p><h2 class="font-display text-lg font-bold mt-0.5">12 transaksi terakhir</h2></div><span class="text-[10px] font-bold text-slate-400">Pts</span></div>' +
          '<div class="mt-3 space-y-2">' + (txRows || '<p class="text-[12px] text-slate-400 text-center py-6">Belum ada transaksi poin.</p>') + '</div>' +
          '</section>' +
          '</div>' +

          '<div data-member-panel="profile" class="hidden space-y-4">' +
          '<section class="rounded-2xl border border-blue-100 bg-white p-4 md:p-5 flex flex-col sm:flex-row sm:items-center gap-4">' + photo +
          '<div class="min-w-0 flex-1"><p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-600">Profil anggota</p><h2 class="font-display text-xl font-bold mt-0.5 truncate">' + esc(displayName(user)) + '</h2><p class="text-[11px] text-slate-500 mt-1">' + esc(p.memberNumber || '-') + ' &middot; Rank ' + esc(rankName) + '</p></div>' +
          '<button type="button" id="btnEdit" class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl pb-btn text-[11px] font-bold"><span class="material-symbols-outlined text-[16px]">edit</span>Edit profil</button>' +
          '</section>' +
          '<section class="rounded-2xl border border-blue-100 bg-white p-4 md:p-5">' +
          '<p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-600">Informasi</p><h2 class="font-display text-lg font-bold mt-0.5">Data akun</h2>' +
          '<dl class="mt-4 grid sm:grid-cols-2 gap-x-8 gap-y-3 text-[12px]">' +
          info('Nama lengkap', user.fullName || '-') +
          info('Alias', user.alias || '-') +
          info('Email', user.email || '-') +
          info('Gender', genderLabel(user.gender)) +
          info('Telepon', p.phone || '-') +
          info('Tanggal lahir', user.birthDate ? PBUI.fmtDate(user.birthDate) : '-') +
          info('Bergabung', p.dateJoined ? PBUI.fmtDate(p.dateJoined) : '-') +
          info('Poin saat ini', PBUI.fmtNum(p.currentPoints)) +
          '</dl></section>' +
          '<section class="rounded-2xl border border-blue-100 bg-blue-50/60 p-4 flex flex-col sm:flex-row items-center justify-between gap-3"><div><p class="text-[12px] font-bold text-blue-900">Foto profil</p><p class="text-[11px] text-blue-700 mt-0.5">Format JPG, PNG, WEBP, atau GIF. Maksimal 3 MB.</p></div><button type="button" id="btnEditPhoto" class="px-4 py-2.5 rounded-xl bg-white border border-blue-200 text-blue-700 text-[11px] font-bold hover:bg-blue-50 transition-colors">Ubah foto</button></section>' +
          '</div>';

        var tabs = document.getElementById('memberTabs');
        if (tabs) tabs.classList.remove('hidden');
        showMemberPanel(activeMemberPanel());
      }

      function info(label, value) {
        return '<div class="flex items-start justify-between gap-3"><dt class="text-slate-400 font-medium shrink-0">' + esc(label) + '</dt><dd class="font-bold text-slate-800 text-right">' + esc(value) + '</dd></div>';
      }
      function card(label, value, icon, cls) {
        return '<div class="rounded-2xl border border-blue-100 bg-white p-4"><div class="flex items-center justify-between"><p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">' + esc(label) + '</p><span class="h-8 w-8 rounded-lg grid place-items-center ' + cls + '"><span class="material-symbols-outlined text-[18px]">' + icon + '</span></span></div><p class="font-display text-2xl md:text-3xl font-bold mt-2">' + esc(value) + '</p></div>';
      }

      function fillForm() {
        var p = (current && current.profile) || {};
        var f = document.getElementById('editForm');
        f.elements.fullName.value = current ? current.fullName || '' : '';
        f.elements.gender.value = current ? current.gender || '' : '';
        f.elements.birthDate.value = dateInput(current && current.birthDate);
        f.elements.phone.value = p.phone || '';
        document.getElementById('photoInput').value = '';
      }

      function openEdit() {
        fillForm();
        var modal = document.getElementById('editModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
      function closeEdit() {
        var modal = document.getElementById('editModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      function loadProfile() {
        return api.get('/auth/me').then(function (u) {
          if (!u || u.role !== 'MEMBER') {
            window.location.replace('member-login.html');
            return;
          }
          render(u);
        });
      }

      function loadStats() {
        return api.get('/members/me/stats').then(function (data) {
          stats = data;
          if (current) render(current);
        }).catch(function (e) {
          PBUI.toast(e && e.message ? e.message : 'Gagal memuat statistik', 'error');
        });
      }

      function uploadPhotoIfAny() {
        var file = document.getElementById('photoInput').files[0];
        if (!file) return Promise.resolve();
        if (file.size > 3 * 1024 * 1024) {
          PBUI.toast('Ukuran foto maksimal 3 MB', 'error');
          return Promise.resolve();
        }
        var fd = new FormData();
        fd.append('photo', file);
        return api.upload('/members/me/photo', fd).then(function () {
          PBUI.toast('Foto profil diperbarui', 'success');
        }).catch(function (e) {
          PBUI.toast(e && e.message ? e.message : 'Foto gagal diunggah', 'error');
        });
      }

      document.addEventListener('click', function (e) {
        if (e.target.closest('#btnEdit') || e.target.closest('#btnEditPhoto')) openEdit();
        if (e.target.closest('#closeEdit') || e.target.closest('#cancelEdit')) closeEdit();
        if (e.target.id === 'editModal') closeEdit();
      });

      document.getElementById('editForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        var payload = {
          fullName: f.elements.fullName.value.trim(),
          gender: f.elements.gender.value || null,
          birthDate: f.elements.birthDate.value || null,
          phone: f.elements.phone.value.trim() || null
        };
        if (payload.fullName.length < 2) {
          PBUI.toast('Nama minimal 2 karakter', 'error');
          return;
        }
        var btn = document.getElementById('saveProfile');
        btn.disabled = true;
        api.patch('/members/me/profile', payload).then(function () {
          return uploadPhotoIfAny();
        }).then(function () {
          closeEdit();
          PBUI.toast('Profil berhasil diperbarui', 'success');
          return Promise.all([loadProfile(), loadStats()]);
        }).catch(function (err) {
          PBUI.toast(err && err.message ? err.message : 'Gagal menyimpan profil', 'error');
        }).then(function () { btn.disabled = false; });
      });

      document.getElementById('btnLogout').addEventListener('click', function () {
        Session.logout().then(function () { window.location.replace('index.html'); });
      });

      Session.init().then(function (u) {
        if (!u) {
          window.location.replace('member-login.html');
          return;
        }
        if (u.role === 'ADMIN') {
          window.location.replace('admin.html');
          return;
        }
        render(u);
        loadStats();
      }).catch(function () {
        window.location.replace('member-login.html');
      });
    })();
  </script>
</body>
</html>
